name: VM Deploy OpenCode

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_ADMIN }}/${{ secrets.REPO_NAME }}
            git checkout main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            docker compose up -d --build
            docker compose ps
            curl -fsS --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:4096/global/health > /dev/null
